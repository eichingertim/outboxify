[build-system]
requires = ["setuptools>=75.8.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "outboxify"
version = "0.1.0"
description = "Polyglot High-Throughput Transactional Outbox Starter for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Outboxify Authors" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.38"]
fastapi = ["fastapi>=0.115.8", "pydantic>=2.10.0"]
kafka = ["aiokafka>=0.11.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.urls]
Repository = "https://github.com/eichingertim/outboxify"
Issues = "https://github.com/eichingertim/outboxify/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

