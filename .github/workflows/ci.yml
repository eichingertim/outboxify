name: CI Quality Gate (Polyglot Matrix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Java Quality Gate (Spring Boot 4.x / JDK 21 & 25)
  # =========================================================================
  java-test:
    name: Java CI (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify & Run Maven Unit Tests
        run: mvn clean test --batch-mode

  # =========================================================================
  # 2. Node.js Quality Gate (Node 20, 22, 24)
  # =========================================================================
  node-test:
    name: Node.js CI (Node v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Node Tests Across Workspaces
        working-directory: ./node
        run: npm test

  # =========================================================================
  # 3. Python Quality Gate (Python 3.11, 3.12, 3.13)
  # =========================================================================
  python-test:
    name: Python CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,sqlalchemy,fastapi,kafka]"

      - name: Run Pytest Async Test Suite
        working-directory: ./python
        run: pytest
