name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Outboxify
title: "[BUG]: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first to avoid duplicates.

  - type: dropdown
    id: runtime
    attributes:
      label: Affected Runtime Ecosystem
      description: Which language runtime is experiencing the issue?
      options:
        - "Java (Spring Boot / Core / Dialects / Kafka)"
        - "Node.js (Core / TypeORM / Prisma / NestJS)"
        - "Python (Core / SQLAlchemy / FastAPI)"
        - "Polyglot / Specification"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database Dialect
      description: Which database are you connecting to?
      options:
        - "Oracle (12c+ / 19c / 23ai)"
        - "PostgreSQL (12+ / 16+)"
        - "MySQL (8.0+ / 8.4+ / 9.x)"
        - "Microsoft SQL Server (2019+ / 2022+)"
        - "H2 / SQLite (In-Memory / Testing)"
        - "Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Outboxify Version
      placeholder: "e.g., 0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / Minimal Reproduction
      description: Steps or code snippet demonstrating the problem.
      placeholder: |
        1. Configure pipeline with dialect '...'
        2. Publish payload in transaction
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Stack Trace
      render: shell
