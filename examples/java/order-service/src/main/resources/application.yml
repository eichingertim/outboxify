server:
  port: 8080

spring:
  application:
    name: order-service-java
  datasource:
    url: jdbc:h2:mem:orders_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

outboxify:
  pipelines:
    orders:
      table-name: ORDERS_OUTBOX
      dialect: H2
      batch-size: 50
      poll-interval-ms: 1000
      processing-timeout-seconds: 30
      max-retries: 3
      immediate-send:
        enabled: true
      broker:
        producer:
          bootstrap-servers: localhost:9092
          acks: all
          enable-idempotence: true
